name: Update Scoreboard
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scoreboard-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Each step's marker must match a marker pair in README.md.
      - uses: 23seriy/readme-scoreboard@v1
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          target_repo: 23seriy/23seriy
          sport: nba
          team: LAL
          marker: readme-scoreboard-nba

      - uses: 23seriy/readme-scoreboard@v1
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          target_repo: 23seriy/23seriy
          sport: mlb
          team: TOR
          marker: readme-scoreboard-mlb

      - uses: 23seriy/readme-scoreboard@v1
        with:
          gh_token: ${{ secrets.GH_TOKEN }}
          target_repo: 23seriy/23seriy
          sport: atp
          team: DJO
          marker: readme-scoreboard-atp
